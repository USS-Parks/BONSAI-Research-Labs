[package]
name = "bonsai-xtask"
description = "Repository-local BONSAI governance and verification tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bonsai-bundle = { path = "../bonsai-bundle" }
bonsai-contracts = { path = "../bonsai-contracts" }
jsonschema = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
bonsai-runtime = { path = "../bonsai-runtime" }
bonsai-platform = { path = "../bonsai-platform" }
bonsai-governor = { path = "../bonsai-governor" }
bonsai-ingest = { path = "../bonsai-ingest" }
bonsai-report = { path = "../bonsai-report" }
prost = "0.14.4"
