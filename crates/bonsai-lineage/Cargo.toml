[package]
name = "bonsai-lineage"
description = "Deterministic cognitive-artifact lifecycle registry for BONSAI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bonsai-contracts = { path = "../bonsai-contracts" }
bonsai-bundle = { path = "../bonsai-bundle" }
prost = "0.14.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"

[dev-dependencies]
bonsai-platform = { path = "../bonsai-platform" }
